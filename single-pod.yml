apiVersion: v1
kind: Pod
metadata: 
  name: contact-app-pod
  labels:
    app: contact-app-label
spec:
  containers: 
    - name: mysql
      image: gkundu091000/contact-manager-app-db:latest
      imagePullPolicy: Always
      ports: 
        - containerPort: 3306
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql

    - name: frontend
      image: gkundu091000/contact-manager-app-frontend:latest
      imagePullPolicy: Always
      env: 
        - name: BACKEND
          value: localhost
      ports:
        - containerPort: 3000
        
    - name: backend 
      image: gkundu091000/contact-manager-app-backend:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 3001
      env:
        - name: DB_HOST
          value: "localhost"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword"
        - name: DB_NAME
          value: "contact_db"
        - name: DB_PORT
          value: "3306"
  volumes:
    - name: mysql-data
      emptyDir: {}

